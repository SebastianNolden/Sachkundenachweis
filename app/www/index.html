<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sachkundenachweis</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="app-header">
    <h1>Sachkundenachweis</h1>
  </header>

  <main class="app-main">
    <section class="view view--zentriert">
      <div class="menu-intro">
        <h2 class="menu-titel">Sachkundenachweis</h2>
        <p class="menu-beschreibung">
          Übe für den Sachkundenachweis mit dem Fragenkatalog dieser App.
        </p>
      </div>

      <!-- Jeder Menüpunkt ist ein eigener "menu-eintrag"; weitere Funktionen
           (Lernmodus, Lernfortschritt, Einstellungen, ...) werden hier später
           als zusätzliche Einträge auf eigenen Seiten ergänzt. -->
      <div class="menu-liste">
        <div class="card menu-eintrag">
          <h3 class="menu-eintrag-titel">Prüfungstest</h3>
          <p class="menu-eintrag-beschreibung">
            Ein Testdurchlauf besteht aus 30 zufällig ausgewählten Fragen aus
            dem gesamten Fragenkatalog. Du kannst dabei jederzeit vor- und
            zurückblättern; das Ergebnis siehst du am Ende.
          </p>
          <button id="start-button" type="button" class="primary-button">Prüfungstest starten</button>
        </div>
      </div>
    </section>
  </main>

  <script src="js/app.js" defer></script>
</body>
</html>
