<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Prüfungstest – Sachkundenachweis</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="app-header">
    <h1>Sachkundenachweis</h1>
  </header>

  <main class="app-main">
    <p id="status" class="status" role="status"></p>

    <!-- Bleibt hidden, bis content.json geladen und die erste Frage gerendert
         ist - so gibt es beim Laden keine leere/kaputte Fragenkarte. -->
    <section id="test-content" class="view" hidden>
      <div class="fortschritt-leiste" aria-hidden="true">
        <div id="fortschritt-balken" class="fortschritt-balken"></div>
      </div>

      <div class="card frage-card">
        <div class="frage-card-kopf">
          <span id="frage-kategorie" class="frage-kategorie"></span>
          <span id="frage-zaehler" class="frage-zaehler"></span>
        </div>

        <img id="frage-bild" class="frage-bild" alt="" hidden>
        <h2 id="frage-text" class="frage-text"></h2>

        <form id="antworten-form" class="antworten-liste"></form>
      </div>

      <nav class="nav-buttons">
        <button id="zurueck-button" type="button" class="secondary-button">Zurück</button>
        <button id="weiter-button" type="button" class="primary-button">Weiter</button>
      </nav>
    </section>
  </main>

  <script src="js/app.js" defer></script>
  <script src="js/test.js" defer></script>
</body>
</html>
